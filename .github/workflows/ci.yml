name: ci

on:
  push:
  pull_request:

jobs:
  paks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC 1.7.4
        run: curl -fsSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: modlock v0.1.77
        run: |
          curl -fsSL -o tools/modlock https://github.com/paralin/modlock/releases/download/v0.1.77/modlock-linux-amd64
          chmod +x tools/modlock
      - name: build, test, sha
        run: sh tools/ci.sh
